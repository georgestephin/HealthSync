{% extends "base.html" %}{% block title %}Treatment detail{% endblock %}
{% block content %}
<section class="banner"><div class="wrap"><h1>Treatment #{{ case_id }}</h1><p>Every step of this treatment and its insurance claim.</p></div></section>
<div class="wrap page">
  <p><a href="{{ url_for('claims.treatments') if user.role == 'patient' else (url_for('claims.cases') if user.role == 'doctor' else url_for('claims.desk_preauths')) }}">Back to the list</a></p>
  <div data-live="{{ url_for('claims.case_detail', case_id=case_id, partial=1) }}" data-interval="8000">{% include "claims/_case_live.html" %}</div>
</div>{% endblock %}
